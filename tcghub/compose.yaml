services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tcghub}
      POSTGRES_USER: ${POSTGRES_USER:-tcghub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcghub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tcghub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcghub} -d ${POSTGRES_DB:-tcghub}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tcghub}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tcghub}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tcghub}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

volumes:
  tcghub_pgdata:
